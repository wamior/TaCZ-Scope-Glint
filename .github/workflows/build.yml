name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [forge-1.18.2, forge-1.19.2, forge-1.20.1, neoforge-1.21.1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch verified TaCZ dependency
        run: python scripts/download_dependencies.py --target ${{ matrix.target }}
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew -Pbuild_targets=${{ matrix.target }} :${{ matrix.target }}:build --console=plain
      - name: Verify release artifact
        run: python scripts/verify_artifacts.py --target ${{ matrix.target }}
      - name: Check publishing and environment-file handling
        run: python -m unittest discover -s scripts
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.target }}
          path: build/libs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.target }}
          path: targets/*/build/reports/tests/
          if-no-files-found: ignore
