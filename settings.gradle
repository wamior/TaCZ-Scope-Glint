pluginManagement {
    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'TaCZ-Scope-Glint'
def selected = providers.gradleProperty('build_targets').orElse(providers.gradleProperty('targets')).get()
selected.split(',')*.trim().each { target ->
    include target
    project(":${target}").projectDir = file("targets/${target}")
}
